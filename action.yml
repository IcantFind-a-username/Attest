name: attest pull request review
description: Run evidence-first pull-request review with bounded verification.
inputs:
  github-token:
    description: Token allowed to update pull-request review comments.
    required: true
  model-api-key:
    description: Model API key for trusted pull-request reviews.
    required: true
  budget-usd:
    description: Maximum model spend for this review, in USD.
    required: false
    default: "1.00"
  samples:
    description: Number of model proposal samples.
    required: false
    default: "5"
  verification-timeout:
    description: Shared verification time limit, in seconds.
    required: false
    default: "600"
  install-ref:
    description: >-
      Which attest to install. Empty (the default) installs the checkout this
      action was resolved from, which is what `uses: …@<tag>` already pins.
      Set it to a tag, branch or commit to install that ref from the public
      repository instead -- useful when the action is vendored or when a
      workflow wants the product and the action to come from different refs.
    required: false
    default: ""
  repository:
    description: Repository to install `install-ref` from.
    required: false
    default: IcantFind-a-username/Attest
runs:
  using: composite
  steps:
    - id: trust
      name: Classify pull request
      shell: sh
      run: sh "${{ github.action_path }}/scripts/action-gate.sh"
    - name: Set up Python
      if: ${{ steps.trust.outputs.trusted == 'true' }}
      uses: actions/setup-python@v6
      with:
        python-version: "3.12.8"
    - name: Install attest from this action
      if: ${{ steps.trust.outputs.trusted == 'true' }}
      shell: sh
      env:
        ATTEST_VENV: ${{ runner.temp }}/attest-venv
        INSTALL_REF: ${{ inputs.install-ref }}
        INSTALL_REPOSITORY: ${{ inputs.repository }}
      run: |
        python -m venv "$ATTEST_VENV"
        "$ATTEST_VENV/bin/python" -m pip install -r "${{ github.action_path }}/requirements-toolchain.lock"
        if [ -n "$INSTALL_REF" ]; then
          # An immutable ref, installed by pip from git. The toolchain lock is
          # still what pins every dependency, so --no-deps stays: the ref
          # chooses the product, never its dependency versions.
          "$ATTEST_VENV/bin/python" -m pip install --no-deps --no-build-isolation \
            "git+https://github.com/${INSTALL_REPOSITORY}@${INSTALL_REF}"
        else
          "$ATTEST_VENV/bin/python" -m pip install --no-deps --no-build-isolation -e "${{ github.action_path }}"
        fi
        "$ATTEST_VENV/bin/python" -m pip check
        "$ATTEST_VENV/bin/python" -c "import attest; print('attest', attest.__version__)"
    - name: Run attest CI review
      if: ${{ steps.trust.outputs.trusted == 'true' }}
      shell: sh
      env:
        ATTEST_VENV: ${{ runner.temp }}/attest-venv
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_MODEL_API_KEY: ${{ inputs.model-api-key }}
        INPUT_BUDGET_USD: ${{ inputs.budget-usd }}
        INPUT_SAMPLES: ${{ inputs.samples }}
        INPUT_VERIFICATION_TIMEOUT: ${{ inputs.verification-timeout }}
      run: sh "${{ github.action_path }}/scripts/action-entrypoint.sh"
