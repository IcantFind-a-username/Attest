# Factory pricing table: USD per million tokens (input / output).
# Data file: model identifiers here are configuration, not code.

default_model = "claude-sonnet-5"
# D-248 (2026-09-14, owner decision): the stage this model serves is the probe --
# under the shipped `probe_generation = true` nothing else calls it -- and it is
# chosen on 40 cases x 3 arms, not on the n = 1 of owner decision 2 (2026-09-03f),
# which this supersedes. The three arms are indistinguishable on recall (12, 14
# and 13 of 40, intervals overlapping), so the default is the cheapest per
# certified case: arm C, this model with thinking adaptive at effort medium.
generation_model = "claude-sonnet-5"
# prompt-cache pricing relative to the input price (owner instruction 3, 2026-09-03):
# a cache write costs 1.25x the input price, a cache read 0.1x
cache_write_multiplier = 1.25
cache_read_multiplier = 0.10

[models.claude-sonnet-5]
input_per_mtok = 2.00
output_per_mtok = 10.00

[models.claude-opus-5]
input_per_mtok = 5.00
output_per_mtok = 25.00

[models.claude-haiku-4-5]
input_per_mtok = 1.00
output_per_mtok = 5.00
