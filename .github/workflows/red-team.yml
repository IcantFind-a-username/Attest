name: red-team

# G-SEC-002: the adversarial matrix on the production isolation backend. It runs
# only when asked (workflow_dispatch), because it builds an image and dispatches
# head code that deliberately reaches for a secret, the network and the host
# filesystem. No model call, no credential, no spend.

on:
  workflow_dispatch:
    inputs:
      observer:
        description: >-
          Also attempt the external observer: ask the kernel's audit subsystem to
          record the container's syscalls and compare that record with what the
          harness claims. Off by default -- it needs root, installs auditd, and
          adds audit rules to the runner.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the locked toolchain
        run: |
          python -m pip install -r requirements-toolchain.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Record the environment
        run: |
          python -V
          docker version --format 'docker {{.Server.Version}}'
          uname -srm

      # The canary is a fixture value, not a credential: it is planted in the
      # controller's environment so the matrix can prove the job never sees it.
      # 4.1: nine attack classes plus the positive control. The matrix is
      # written into `docs/acceptance/` so the result travels with the
      # repository rather than expiring with the workflow artifact.
      - name: Red-team matrix on linux-container-v1
        run: |
          mkdir -p docs/acceptance
          python scripts/release/redteam.py --record redteam.md
          cp redteam.md "docs/acceptance/$(date -u +%Y-%m-%d)-redteam-nine.md"

      - name: The matrix
        if: always()
        run: cat redteam.md || echo "no matrix written"

      # G-SEC-002's `INSUFFICIENT` row. Every other row of the matrix is
      # observed from inside the product; this one asks the kernel. It is a
      # separate step because it needs root and changes the runner's audit
      # configuration, and because a failure here must not fail the matrix.
      - name: External observer (kernel audit)
        if: ${{ inputs.observer }}
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq auditd audispd-plugins
          sudo auditctl -s || true
          sudo -E "$(which python)" scripts/release/observer.py probe \
            --json observer-probe.json || true
          sudo -E "$(which python)" scripts/release/observer.py run \
            --json observer.json --matrix redteam-observed.md || true

      - name: The observer's record
        if: ${{ always() && inputs.observer }}
        run: cat observer.json observer-probe.json 2>/dev/null || echo "no observer record"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-matrix
          path: |
            redteam.md
            observer.json
            observer-probe.json
          if-no-files-found: warn
