name: gates

on:
  push:
    branches: [main]
    # Actions minutes: this job is 45 minutes of runner at its ceiling, and a
    # documentation commit cannot change what it measures. Prose is skipped;
    # every path that carries behaviour (src, tests, scripts, action.yml, the
    # lock, this file) still triggers it. `paths-ignore` is a *push* filter
    # only, so the pull-request gate is unaffected and a branch merged to main
    # has already been gated at its own head.
    paths-ignore:
      - "**.md"
      - "docs/**"
  # Before the merge rather than after it: PR #16 merged with a version string
  # its own packaging test refuses, because the only check a pull request had
  # was the attest self-review. The `checks` job below is what a pull request
  # gets; `gates` stays a push-to-main job. No `paths-ignore` here, on purpose:
  # `checks` is a required status check under the branch ruleset, and a
  # required check that a documentation-only pull request never triggers would
  # leave that pull request waiting for a run that will not come.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The pull-request half of the gate: lint, types, whitespace, packaging and
  # every test that needs neither a docker daemon nor the release drills. What
  # it leaves to `gates` on main is deliberate and small -- the container
  # isolation matrix (`tests/execution/test_linux_isolation.py`, which pulls
  # `python:3.9-slim`), the red-team matrix and the release drills -- because
  # those are the minutes, and a pull request needs the answer before the merge
  # more than it needs the last 5% of coverage. No coverage floor here: the
  # floor is measured once, on main, with the container tests in the
  # denominator.
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install the locked toolchain
        run: |
          python -m pip install -r requirements-toolchain.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy src/attest

      - name: git diff --check
        run: git diff --check

      # The drills are back in, and their absence is why: excluding them let a
      # probe-refusal regression reach `main` at 516b924 and fail `gates` there
      # with 8 drill failures. A release safety net that only runs after the
      # merge is not gating anything. What stays out is the container isolation
      # matrix, which pulls `python:3.9-slim`, and the red-team matrix, which
      # builds an image and dispatches deliberately hostile code -- both belong
      # on `main` and on their own dispatch.
      - name: Pytest, without the container and red-team matrices
        run: |
          python -m pytest -p no:cacheprovider \
            --ignore=tests/execution/test_linux_isolation.py \
            --ignore=tests/release/test_redteam_matrix.py

      - name: Build the wheel and the sdist
        run: |
          python -m pip install build
          python -m build --outdir dist

  gates:
    if: github.event_name != 'pull_request'
    # An ordinary work-order gate runs one supported Python (AGENTS.md §13);
    # 3.12 is the toolchain's primary. The point of running here rather than on
    # a development host is `tests/execution/test_linux_isolation.py`: it needs a
    # docker daemon that can pull `python:3.9-slim`, which the owner's machine
    # cannot, and it is the only test that covers `ContainerAdapter.run` — the
    # whole of the kernel coverage shortfall measured locally.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # full history and tags: the M-01 probe test builds a worktree at a fixed
      # baseline commit, and the rollback drill resolves the documented oldest
      # install ref (a tag). A shallow checkout has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # the cache key is the pinned lock, so it changes only when the
          # toolchain does. `cache-dependency-path` is required, not cosmetic:
          # setup-python's default pip pattern is `**/requirements.txt`, which
          # this repository does not have, and the step fails outright when
          # nothing matches.
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install the locked toolchain
        run: |
          python -m pip install -r requirements-toolchain.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Record the environment
        run: |
          python -V
          python -c "import hashlib,pathlib;print('lock sha256:',hashlib.sha256(pathlib.Path('requirements-toolchain.lock').read_bytes()).hexdigest())"
          docker info --format 'docker {{.ServerVersion}}' || echo "no docker daemon"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy src/attest

      - name: git diff --check
        run: git diff --check

      # No deselection: the isolation tests are the reason this job exists. The
      # coverage floor (`fail_under = 90`) binds attest.certification and
      # attest.execution only; the other packages print as observations.
      - name: Pytest with coverage
        run: python -m pytest --cov=src/attest --cov-report=term-missing

      - name: Informational package coverage
        if: always()
        run: |
          for package in review cli github benchmark core; do
            echo "--- attest.$package"
            python -m coverage report --include="src/attest/$package/*" --fail-under=0
          done

      # 7.1: the wheel is part of the gate, not an afterthought at tag time. A
      # metadata mistake that only shows up when someone tries to install the
      # release is the kind of failure a tag cannot take back.
      - name: Build the wheel and the sdist
        run: |
          python -m pip install build
          python -m build --outdir dist
          ls -l dist

      - name: The built wheel's CLI runs from a clean environment
        run: |
          python -m pip install pipx
          python -m pipx run --spec "$(ls dist/*.whl)" attest verify --help

