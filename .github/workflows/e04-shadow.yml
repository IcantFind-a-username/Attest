name: e04-shadow

# E-04, stratum v3: the frozen pull-request sample of
# `benchmarks/studies/e04-prospective-v3`, reviewed on the declared CI platform.
#
# It runs only when asked (workflow_dispatch) and it is **paid** -- it calls the
# model with the repository's own ANTHROPIC_API_KEY, inside the repository's own
# runner, exactly as the shipped Action does. Reserve in DEVSPEND.md first.
#
# Why it exists: the same study run on a developer Mac produced 24 reproduction
# attempts and 24 `environment bootstrap failed` deferrals, because buildkit on
# that host hangs resolving registry metadata and every image build times out.
# A silence over an executor that never ran is not a measurement (D-177), so the
# study has to run where the executor works -- which is the platform the product
# actually ships to.
#
# **Nothing is published anywhere.** The driver uses the local review path, so no
# GitHub client is constructed and no comment, review or status can be written to
# any repository. The population is the frozen `sample.jsonl`; this workflow never
# re-selects it.

on:
  workflow_dispatch:
    inputs:
      cap_usd:
        description: >-
          Hard cumulative spend cap for the run, in US dollars. The study's own
          preregistered cost_cap_usd binds independently and the smaller wins.
        type: string
        default: "6.00"
      limit:
        description: Stop after this many units (0 = every unit not yet recorded).
        type: string
        default: "0"
      trials_file:
        description: >-
          Trials file under the study directory. Leave empty to continue
          trials.jsonl; name a new one (e.g. trials-runner-notes.jsonl) to re-run
          the same frozen sample without touching the earlier run's data.
        type: string
        default: ""
      value_notes_visible:
        description: Render the value-class yellow line (owner instruction 7 of 2026-09-11).
        type: boolean
        default: false
      gate_notes_visible:
        description: Render the gate yellow line (owner instruction 7 of 2026-09-11).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the locked toolchain
        run: |
          python -m pip install -r requirements-toolchain.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Record the environment
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          docker version --format 'docker {{.Server.Version}}'

      - name: Clone the population
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p .attest/corpora
          # Only the repositories this runner's token can read. A repository the
          # token cannot clone is skipped by name and reported as skipped -- it
          # is never quietly dropped from the denominator.
          for repo in Attest us-stock-helper Corum IcantFind-a-username -SC6122-Group5-Credit-Default; do
            dir=".attest/corpora/$(echo "$repo" | tr '[:upper:]' '[:lower:]' | sed 's/^-//')"
            if git clone -q "https://github.com/IcantFind-a-username/${repo}.git" "$dir"; then
              git -C "$dir" fetch -q origin '+refs/pull/*/head:refs/remotes/origin/pr/*' || true
              echo "cloned ${repo}"
            else
              echo "SKIPPED ${repo}: not readable by this token"
            fi
          done

      - name: Run the shadow
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATTEST_ALLOW_PAID_API: "1"
        run: |
          python -u scripts/corpus/prospective_shadow.py \
            --study e04-prospective-v3 run \
            --allow-paid-api \
            --reserve "${{ inputs.cap_usd }}" \
            --limit "${{ inputs.limit }}" \
            --trials-file "${{ inputs.trials_file }}" \
            ${{ inputs.value_notes_visible && '--value-notes-visible' || '' }} \
            ${{ inputs.gate_notes_visible && '--gate-notes-visible' || '' }} \
            2>&1 | tee shadow-run.log

      - name: Report
        if: always()
        run: |
          python -u scripts/corpus/prospective_shadow.py --study e04-prospective-v3 report || true

      - name: Upload the trials, the report and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e04-shadow-v3
          path: |
            benchmarks/studies/e04-prospective-v3/trials*.jsonl
            benchmarks/studies/e04-prospective-v3/lines-*.jsonl
            benchmarks/studies/e04-prospective-v3/report.json
            shadow-run.log
            .attest/corpora/*/.attest/ledger.jsonl
          # upload-artifact v4.4+ skips hidden paths unless told otherwise; run
          # 34618040099 lost every ledger to this default (D-225)
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
