# This file is intentionally maintained as a fully pinned dependency closure,
# including the project's build backend, runtime dependencies, gate tools, and
# every transitively required distribution. Environment markers are used only
# where the same NumPy release has no wheel spanning both required CPython
# runtimes. Install without dependency re-resolution:
#
#   python -m pip install -r requirements-toolchain.lock
#   python -m pip install --no-deps --no-build-isolation -e .
#   python -m pip check
