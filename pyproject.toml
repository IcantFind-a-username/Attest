[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attest"
version = "0.0.1"
description = "Experimental evidence-first LLM code evaluation with differential reproduction"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Franz Xu" }]
dependencies = ["numpy>=1.26", "anthropic>=1.0", "pytest>=8"]

[project.scripts]
attest = "attest.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
]

[tool.attest.toolchain]
lock = "requirements-toolchain.lock"
minimum-python = "3.11"
primary-python = "3.12"
targets = ["linux-x86_64", "macos-arm64"]

[tool.hatch.build.targets.wheel]
packages = ["src/attest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "regression: pins numbers from the seed experiment record (RESULTS.md)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
# no python_version pin: numpy>=2.5 type stubs need 3.12+ syntax; mypy follows
# the running interpreter
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["src/attest"]

[tool.coverage.run]
source = ["src/attest"]

[tool.coverage.report]
show_missing = true
include = [
    "src/attest/review/*",
    "src/attest/cli/*",
    "src/attest/github/*",
]
fail_under = 90
