[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attest"
version = "0.1.0rc1"
description = "Evidence-first pull-request review: every claim is a reproduction on two revisions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Franz Xu" }]
keywords = [
    "code-review",
    "static-analysis",
    "pull-request",
    "llm",
    "pytest",
    "reproduction",
    "differential-testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "anthropic>=1.0", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/IcantFind-a-username/Attest"
Repository = "https://github.com/IcantFind-a-username/Attest"
Documentation = "https://github.com/IcantFind-a-username/Attest/blob/main/docs/README.md"
Changelog = "https://github.com/IcantFind-a-username/Attest/blob/main/CHANGELOG.md"
Issues = "https://github.com/IcantFind-a-username/Attest/issues"

[project.scripts]
attest = "attest.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
]

[tool.attest.toolchain]
lock = "requirements-toolchain.lock"
minimum-python = "3.11"
primary-python = "3.12"
targets = ["linux-x86_64", "macos-arm64"]

[tool.hatch.build.targets.wheel]
packages = ["src/attest"]

[tool.hatch.build.targets.sdist]
# the source distribution is the product plus what makes its claims checkable:
# the decisions, the acceptance evidence and the spend ledger travel with it
include = [
    "src/attest",
    "tests",
    "docs",
    "scripts",
    "action.yml",
    "conftest.py",
    "pyproject.toml",
    "README.md",
    "CHANGELOG.md",
    "DECISIONS.md",
    "DEVSPEND.md",
    "AGENTS.md",
    "LICENSE",
    "NOTICE",
    "requirements-toolchain.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "regression: pins numbers from the seed experiment record (RESULTS.md)",
    "real_backend: run with the product's real executor backend selection",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
# no python_version pin: numpy>=2.5 type stubs need 3.12+ syntax; mypy follows
# the running interpreter
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["src/attest"]

[tool.coverage.run]
source = ["src/attest"]

[tool.coverage.report]
show_missing = true
include = [
    "src/attest/certification/*",
    "src/attest/execution/*",
]
fail_under = 90
